name: RWF809 native Linux vs WSL2 ext4 equivalent POSIX benchmark
on:
  push:
    branches:
      - experiment/809-linux-wsl2-ext4-bench-20261114
    paths:
      - .github/workflows/rwf809-linux-wsl2-ext4.yml
      - rwf809/posix-ext4-benchmark.c
permissions:
  contents: read
jobs:
  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Make a real ext4 loop-mounted volume and compile exact C source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          gcc --version | head -1 | tee results/compiler.txt
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pthread -o /tmp/rwf809-posix-bench rwf809/posix-ext4-benchmark.c
          sha256sum rwf809/posix-ext4-benchmark.c /tmp/rwf809-posix-bench > results/hashes.txt
          mkdir -p pinned-elf
          cp /tmp/rwf809-posix-bench pinned-elf/rwf809-posix-bench
          sha256sum pinned-elf/rwf809-posix-bench > pinned-elf/sha256.txt
          truncate -s 8589934592 "$RUNNER_TEMP/rwf809-native-ext4.img"
          mkfs.ext4 -q -F -b 4096 "$RUNNER_TEMP/rwf809-native-ext4.img"
          sudo mkdir -p /mnt/rwf809-ext4
          sudo mount -t ext4 -o loop "$RUNNER_TEMP/rwf809-native-ext4.img" /mnt/rwf809-ext4
          sudo chown "$USER" /mnt/rwf809-ext4
          findmnt -no FSTYPE,SOURCE,TARGET /mnt/rwf809-ext4 | tee results/mount.txt
          test "$(findmnt -no FSTYPE /mnt/rwf809-ext4)" = "ext4"
          stat -f -c '%s %b' /mnt/rwf809-ext4 > results/block-sizes.txt
          /tmp/rwf809-posix-bench native-linux /mnt/rwf809-ext4 | tee results/measurements.txt
          test "$(grep -c '^RWF809_POSIX_CSV ' results/measurements.txt)" -eq 160
          grep -q '^RWF809_POSIX_PASS ' results/measurements.txt
          sudo umount /mnt/rwf809-ext4
          echo "RWF809_NATIVE_LINUX_EXT4_BENCH_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: rwf809-posix-pinned-elf
          path: pinned-elf/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rwf809-posix-native-linux-ext4
          path: results/
          if-no-files-found: warn
          retention-days: 7
  windows-wsl2:
    needs: linux-native
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rwf809-posix-pinned-elf
          path: pinned-elf/
      - name: Install and start actual WSL2 Ubuntu
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'results' | Out-Null
          $stdout=(Join-Path $env:GITHUB_WORKSPACE 'results\install.txt')
          $stderr=(Join-Path $env:GITHUB_WORKSPACE 'results\install-errors.txt')
          $p=Start-Process -FilePath 'wsl.exe' -ArgumentList @('--install','--distribution','Ubuntu','--web-download','--no-launch') -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($p.ExitCode -ne 0) {throw "WSL Ubuntu installation failed $($p.ExitCode)"}
          $root=(& wsl.exe -d Ubuntu -u root -- findmnt -no FSTYPE / | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $root -ne 'ext4') {throw "WSL root is not ext4: $root"}
          (& wsl.exe -d Ubuntu -u root -- uname -r) | Set-Content -Path results\kernel.txt -Encoding utf8
          $winSource=(Join-Path $env:GITHUB_WORKSPACE 'rwf809\posix-ext4-benchmark.c')
          $gitBlob=(& git.exe rev-parse 'HEAD:rwf809/posix-ext4-benchmark.c' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $gitBlob.Length -ne 40) {throw "Pinned Git source blob lookup failed"}
          $gitBlob | Set-Content -Path results\source-git-blob.txt -Encoding utf8
          $winBinary=(Join-Path $env:GITHUB_WORKSPACE 'pinned-elf\rwf809-posix-bench')
          $expected=(Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'pinned-elf\sha256.txt') -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          $actual=(Get-FileHash -LiteralPath $winBinary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {throw 'Downloaded ELF SHA does not match Linux producer'}
          $linuxBinary='/mnt/'+$winBinary.Substring(0,1).ToLowerInvariant()+'/'+$winBinary.Substring(3).Replace('\','/')
          & wsl.exe -d Ubuntu -u root -- test -f $linuxBinary
          if ($LASTEXITCODE -ne 0) {throw "Linux cannot see downloaded ELF $linuxBinary"}
          & wsl.exe -d Ubuntu -u root -- cp $linuxBinary /root/rwf809-posix-bench
          if ($LASTEXITCODE -ne 0) {throw "Failed to copy compiled ELF to ext4 root"}
          & wsl.exe -d Ubuntu -u root -- chmod 755 /root/rwf809-posix-bench
          if ($LASTEXITCODE -ne 0) {throw "Failed to mark POSIX binary executable"}
          $seen=(& wsl.exe -d Ubuntu -u root -- sha256sum /root/rwf809-posix-bench | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $seen.StartsWith($expected)) {throw "WSL ext4 executable hash mismatch"}
          $seen | Set-Content -Path results\hashes.txt -Encoding utf8
          Write-Host "RWF809_EXACT_SAME_LINUX_ELF_SHA256 $expected"
          (& wsl.exe -d Ubuntu -u root -- ldd --version) | Select-Object -First 1 | Set-Content -Path results\libc-version.txt -Encoding utf8
          & wsl.exe -d Ubuntu -u root -- mkdir -p /mnt/rwf809-ext4
          (& wsl.exe -d Ubuntu -u root -- findmnt -no FSTYPE,SOURCE,TARGET /) | Set-Content -Path results\mount.txt -Encoding utf8
          (& wsl.exe -d Ubuntu -u root -- stat -f -c '%s %b' /mnt/rwf809-ext4) | Set-Content -Path results\block-sizes.txt -Encoding utf8
          & wsl.exe -d Ubuntu -u root -- /root/rwf809-posix-bench wsl2 /mnt/rwf809-ext4 > results\measurements.txt
          if ($LASTEXITCODE -ne 0) {throw 'WSL2 ext4 benchmark execution failed'}
          $data=Get-Content -LiteralPath results\measurements.txt
          if (@($data | Where-Object {$_ -like 'RWF809_POSIX_CSV *'}).Count -ne 160 -or
              -not @($data | Where-Object {$_ -like 'RWF809_POSIX_PASS *'}).Count) {
            throw 'WSL2 raw sample count or completion marker invalid'
          }
          Write-Host "RWF809_WSL2_EXT4_BENCH_PASS 160 valid measured rows"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rwf809-posix-wsl2-ext4
          path: results/
          if-no-files-found: warn
          retention-days: 7
