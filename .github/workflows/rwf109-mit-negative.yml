name: RWF 109 MIT prereq negative native matrix
on:
  push:
    branches: [issue-1-rwf109-consumer-integration-20261031]
    paths: [.ci/rwf109-mit-negative]
permissions:
  contents: read
jobs:
  negative:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: fd5c5653c14d438f0b0243afd5907ab0cc5424bb
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert exact source and check negative/MIT version contracts
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "fd5c5653c14d438f0b0243afd5907ab0cc5424bb"
          python -m unittest -v tests.test_manual_mit_negative_acceptance tests.test_manual_mit_version_contract
