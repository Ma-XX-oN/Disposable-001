name: RWF109 exact-source public workbench
on:
  push:
    branches:
      - verification-109-exact-source-20261031
    paths:
      - .ci/verification-109-run
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: 372ec0e46c8b52f90d312edc0bd8688b28f48036
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert tested RWF source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "372ec0e46c8b52f90d312edc0bd8688b28f48036"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run registered completion and affected interface checks
        run: python scripts/validate-issue.py --groups issue-109-single-prelim issue-109-submission issue-109-functional-workflow issue-109-done-dispatch issue-109-consumer-integration-adapter issue-109-provider-pipeline issue-109-retirement-bridge issue-109-terminal-v2 issue-109-prelim-candidate issue-109-lifecycle-binding issue-109-landed-results issue-109-failed-terminal issue-109-ready-scheduler issue-109-current-policy issue-109-hosted-artifact-bridge issue-109-source-identity issue-109-done-runtime issue-109-done-cli issue-109-promotion-provider issue-109-results-discovery issue-109-failure-handoff issue-109-queue-cycle issue-109-queue-scheduler issue-109-completion issue-109-canonical-lifecycle issue-109-shared-lifecycle issue-109-check-issuer issue-109-hosted-stages issue-109-policy-admission issue-109-stage-certification issue-109-mit-defer-v2 issue-109-evidence-provider issue-109-evidence-promotion issue-109-host-coordination issue-109-provider-acceptance issue-109-executor issue-109-coordination issue-109-native-host-transport issue-572-engine-remote-preparation issue-572-engine-version-adapter issue-571-terminal-phase regression-version-adapter regression-workflow-transitions integration-issue-start issue-545-real-consumer-verify issue-545-unified-test-cli regression-manual-test-catalogue regression-manual-test-result integration-manual-test-cli integration-red-completion-cli issue-703-mit-negative-acceptance issue-703-mit-version-contract
