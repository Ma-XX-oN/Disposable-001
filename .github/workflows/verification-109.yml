name: RWF109 exact-source public workbench
on:
  push:
    branches:
      - verification-109-exact-source-20261031
    paths:
      - .ci/verification-109-run
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: 9d63970eb14791e5f5ce40d932f7345eae73d815
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert tested RWF source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "9d63970eb14791e5f5ce40d932f7345eae73d815"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile affected code and tests
        run: python -m py_compile repo_workflow/ci_invocation.py repo_workflow/done_cli.py repo_workflow/done_runtime.py tests/test_ci_invocation.py tests/test_ci_invocation_trigger_contract.py tests/test_done_cli.py tests/test_done_runtime.py
      - name: Run registered single-PRELIM completion checks
        run: python scripts/validate-issue.py --groups issue-109-single-prelim issue-109-functional-workflow issue-109-done-dispatch issue-109-submission issue-109-done-cli issue-572-engine-remote-preparation issue-545-unified-test-cli regression-manual-test-result integration-manual-test-cli
