name: RWF 791 Positive Public CMD Reuse
on:
  push:
    branches:
      - issue-1-rwf791-reuse-20261103
    paths:
      - .ci/issue791-reuse-trigger
permissions:
  contents: read
  actions: read
jobs:
  public-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f78b6b976ed26041d5f3d3b2a36130816da4970c
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare original request source and exact engine
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f78b6b976ed26041d5f3d3b2a36130816da4970c
          git switch -c issue-1-rwf791-reuse-20261103
          test "$(git show HEAD:.ci/red-green.txt)" = issue-1-rwf788-red
          git clone --quiet https://github.com/Ma-XX-oN/RepoWorkflow.git "$RUNNER_TEMP/rwf-engine"
          git -C "$RUNNER_TEMP/rwf-engine" checkout --quiet --detach b2fbd827d44ea06b2c8090c601f82e5072204c0a
          test "$(git -C "$RUNNER_TEMP/rwf-engine" rev-parse HEAD)" = b2fbd827d44ea06b2c8090c601f82e5072204c0a
          python -m pip install -r "$RUNNER_TEMP/rwf-engine/requirements.txt"
      - name: Public unpolled CMD reuse followed by completed read-only poll
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          adapter = str(Path(os.environ['RUNNER_TEMP']) / 'rwf-engine/adapters/repo-info-ci-github.py')
          cfg = {
            'schema': 1,
            'versionCommand': ['python', '--version'],
            'infoCommand': ['python', adapter,
              '--repository', 'Ma-XX-oN/Disposable-001',
              '--workflow', 'remote-rwf.yml'],
            'repository': {'integrationBranch':'main','authoritativeRemote':'origin'},
            'environments': [{'id':'smoke','validationCommand':['python','--version']}],
            'artifacts': [],
          }
          Path('.ci/repoworkflow.json').write_text(json.dumps(cfg)+'\n', encoding='utf-8')
          PY
          before="$(git ls-remote --heads origin 'CMD-*' | sort)"
          source="$(git rev-parse HEAD)"
          set +e
          submission="$(python "$RUNNER_TEMP/rwf-engine/repo_workflow.py" --root "$PWD" test RED issue-1-rwf788-red --remote 2>&1)"
          submit_rc=$?
          result="$(python "$RUNNER_TEMP/rwf-engine/repo_workflow.py" --root "$PWD" remote-status 18 --poll 0 2>&1)"
          result_rc=$?
          set -e
          printf 'SUBMIT_RC=%s\n%s\n' "$submit_rc" "$submission"
          printf 'RESULT_RC=%s\n%s\n' "$result_rc" "$result"
          test "$submit_rc" -eq 0
          grep -Fq "CMD-18 CMD-18-issue-1-rwf791-reuse-20261103 REUSED" <<<"$submission"
          test "$result_rc" -eq 0
          grep -Fq "CMD-18 CMD-18-issue-1-rwf791-reuse-20261103 COMPLETED exit=$result_rc" <<<"$result"
          grep -Fq 'RWF788_EXPECTED_FAIL' <<<"$result"
          test "$(git rev-parse HEAD)" = "$source"
          after="$(git ls-remote --heads origin 'CMD-*' | sort)"
          test "$before" = "$after"
