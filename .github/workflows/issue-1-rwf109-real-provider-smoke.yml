name: RWF109 disposable real provider smoke
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - issue-1-rwf109-real-provider-smoke-20261101
    paths:
      - .ci/rwf109-provider-smoke
permissions:
  contents: write
jobs:
  native-cas-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: 64433370858a5b8f58ff4f3eb09b544399f4e03e
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact correction and run registered regression
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "64433370858a5b8f58ff4f3eb09b544399f4e03e"
          python -m unittest -v tests.test_issue_109_ref_cas_request_identity
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: 64433370858a5b8f58ff4f3eb09b544399f4e03e
          path: rwf-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert exact RWF product revision
        shell: bash
        run: |
          test "$(git -C rwf-source rev-parse HEAD)" = "64433370858a5b8f58ff4f3eb09b544399f4e03e"
      - name: Run exact-source permanent #109 CAS regression
        working-directory: rwf-source
        run: python -m unittest -v tests.test_issue_109_ref_cas_request_identity
      - name: Exercise real disposable provider with run-scoped test verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue_1_rwf109_real_provider_smoke.py
