name: RWF809 Windows RAM NTFS versus disk NTFS benchmark
on:
  push:
    branches:
      - experiment/809-ram-vs-disk-ntfs-bench-20261114
    paths:
      - .github/workflows/rwf809-ram-vs-disk-ntfs.yml
      - rwf809/compare-ram-vs-disk-ntfs.ps1
permissions:
  contents: read
concurrency:
  group: rwf809-ram-disk-ntfs
  cancel-in-progress: false
jobs:
  windows-only:
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install approved Microsoft-signed driver and verify 512MiB NTFS RAM volume
        shell: pwsh
        run: |
          & .\rwf809\probe-imdisk-ram-ntfs.ps1 -Output (Join-Path $env:GITHUB_WORKSPACE 'ram-results')
      - name: Run same native benchmark on matched 512MiB RAM and VHDX NTFS
        shell: pwsh
        run: |
          & .\rwf809\compare-ram-vs-disk-ntfs.ps1 -Output (Join-Path $env:GITHUB_WORKSPACE 'comparison')
      - name: Preserve 768 raw samples and exact volume identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwf809-ntfs-ram-vs-disk-comparison
          path: |
            ram-results/imdisk-probe.json
            comparison/
          if-no-files-found: warn
          retention-days: 7
