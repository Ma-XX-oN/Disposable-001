name: rwf-ci-overlap

# Test: does the CI token's 80-per-minute content limit share an allowance
# with a person's login posting at the same moment?
on:
  workflow_dispatch:
    inputs:
      start:
        description: UTC epoch second to start posting
        required: true
      count:
        description: Comments to post
        default: '50'

permissions:
  issues: write
  contents: read

jobs:
  overlap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      START: ${{ inputs.start }}
      COUNT: ${{ inputs.count }}
    steps:
      - uses: actions/checkout@v4
      - name: Post comments from the start time
        run: |
          python3 .github/rwf-overlap.py "$GITHUB_REPOSITORY" "$START" "$COUNT" CI
