name: RWF 791 Exact CMD Readback
on:
  push:
    branches: [issue-1-rwf791-readback-*]
    paths: [.ci/readback-trigger]
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05d90a71cee6e484c14e6ed1816c729f01c48f60
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source and get CMD refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "05d90a71cee6e484c14e6ed1816c729f01c48f60"
          git switch -c issue-1-rwf791-final-provider-20261104
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Install pinned engine
        shell: bash
        env:
          RWF_ENGINE_ROOT: ${{ runner.temp }}/rwf-engine
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Ma-XX-oN/RepoWorkflow.git "$RWF_ENGINE_ROOT"
          git -C "$RWF_ENGINE_ROOT" checkout --quiet --detach cf135ce15293ab169ba66f28a81e14776fa10bb6
          test "$(git -C "$RWF_ENGINE_ROOT" rev-parse HEAD)" = "cf135ce15293ab169ba66f28a81e14776fa10bb6"
          python -m pip install -r "$RWF_ENGINE_ROOT/requirements.txt"
      - name: Read durable success and failure using public RWF CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RWF_ENGINE_ROOT: ${{ runner.temp }}/rwf-engine
        run: |
          set -euo pipefail
          set +e
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 35 >out35.txt 2>err35.txt
          rc35=$?
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 34 >out34.txt 2>err34.txt
          rc34=$?
          set -e
          printf 'CMD35 code %s\n' "$rc35"
          cat out35.txt err35.txt
          printf 'CMD34 code %s\n' "$rc34"
          cat out34.txt err34.txt
          test "$rc35" -eq 0
          test "$rc34" -eq 2
          grep -q 'RWF788_EXPECTED_FAIL' out35.txt
          grep -q 'expected-failure-declaration-missing' out34.txt
          set +e
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 35 --poll 0.01 >poll35.txt 2>poll35err.txt
          poll35=$?
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 34 --poll 0.01 >poll34.txt 2>poll34err.txt
          poll34=$?
          set -e
          printf 'POLL CMD35 exit=%s\n' "$poll35"
          cat poll35.txt poll35err.txt
          printf 'POLL CMD34 exit=%s\n' "$poll34"
          cat poll34.txt poll34err.txt
          test "$poll35" -eq 0
          test "$poll34" -eq 2
          grep -q 'CMD-35 .* COMPLETED exit=0' poll35.txt
          grep -q 'CMD-34 .* COMPLETED exit=2' poll34.txt
          set +e
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 36 >pending36.txt 2>pending36err.txt
          rc36=$?
          set -e
          printf 'CMD36 pending code %s\n' "$rc36"
          cat pending36.txt pending36err.txt
          test "$rc36" -eq 75
          grep -q 'CMD-36 .* PENDING' pending36.txt
          set +e
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 39 >out39.txt 2>err39.txt
          code39=$?
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 40 >out40.txt 2>err40.txt
          code40=$?
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 39 --poll 0.01 >poll39.txt 2>poll39err.txt
          polled39=$?
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 40 --poll 0.01 >poll40.txt 2>poll40err.txt
          polled40=$?
          set -e
          printf 'Current CMD39=%s CMD40=%s POLL39=%s POLL40=%s\n' "$code39" "$code40" "$polled39" "$polled40"
          test "$code39" -eq 0
          test "$code40" -eq 2
          test "$polled39" -eq 0
          test "$polled40" -eq 2
          grep -q 'CMD-39 .* COMPLETED exit=0' poll39.txt
          grep -q 'CMD-40 .* COMPLETED exit=2' poll40.txt
          grep -q 'RWF788_EXPECTED_FAIL' out39.txt
          grep -q 'expected-failure-declaration-missing' out40.txt
          set +e
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 41 --poll 0.01 >poll41.txt 2>err41.txt
          poll41=$?
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 42 --poll 0.01 >poll42.txt 2>err42.txt
          poll42=$?
          set -e
          printf 'CURRENT CMD41=%s CMD42=%s\n' "$poll41" "$poll42"
          test "$poll41" -eq 0
          test "$poll42" -eq 2
          grep -q 'CMD-41 .* COMPLETED exit=0' poll41.txt
          grep -q 'CMD-42 .* COMPLETED exit=2' poll42.txt
          grep -q 'RWF788_EXPECTED_FAIL' poll41.txt
          grep -q 'expected-failure-declaration-missing' poll42.txt
          set +e
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 45 --poll 0.01 >poll45.txt 2>err45.txt
          polled45=$?
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 46 --poll 0.01 >poll46.txt 2>err46.txt
          polled46=$?
          set -e
          printf 'LATEST CMD45=%s CMD46=%s\n' "$polled45" "$polled46"
          test "$polled45" -eq 0
          test "$polled46" -eq 2
          grep -q 'CMD-45 .* COMPLETED exit=0' poll45.txt
          grep -q 'CMD-46 .* COMPLETED exit=2' poll46.txt
          grep -q 'RWF788_EXPECTED_FAIL' poll45.txt
          grep -q 'expected-failure-declaration-missing' poll46.txt
          set +e
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 49 --poll 0.01 >poll49.txt 2>err49.txt
          code49=$?
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 50 --poll 0.01 >poll50.txt 2>err50.txt
          code50=$?
          set -e
          printf 'EXACT 3.15 CMD49=%s CMD50=%s\n' "$code49" "$code50"
          test "$code49" -eq 0
          test "$code50" -eq 2
          grep -q 'CMD-49 .* COMPLETED exit=0' poll49.txt
          grep -q 'CMD-50 .* COMPLETED exit=2' poll50.txt
          grep -q 'RWF788_EXPECTED_FAIL' poll49.txt
          grep -q 'expected-failure-declaration-missing' poll50.txt
          set +e
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 51 --poll 0.01 >poll51.txt 2>err51.txt
          code51=$?
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 52 --poll 0.01 >poll52.txt 2>err52.txt
          code52=$?
          set -e
          printf 'EXACT 3.16 CMD51=%s CMD52=%s\n' "$code51" "$code52"
          test "$code51" -eq 0
          test "$code52" -eq 2
          grep -q 'CMD-51 .* COMPLETED exit=0' poll51.txt
          grep -q 'CMD-52 .* COMPLETED exit=2' poll52.txt
          grep -q 'RWF788_EXPECTED_FAIL' poll51.txt
          grep -q 'expected-failure-declaration-missing' poll52.txt
