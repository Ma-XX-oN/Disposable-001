name: RWF 791 Exact CMD Readback
on:
  push:
    branches: [issue-1-rwf791-readback-*]
    paths: [.ci/readback-trigger]
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7e296249e84b8ffdbb13c76e7e315df070b5fc7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source and get CMD refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d7e296249e84b8ffdbb13c76e7e315df070b5fc7"
          git switch -c issue-1-rwf791-final-provider-20261104
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Install pinned engine
        shell: bash
        env:
          RWF_ENGINE_ROOT: ${{ runner.temp }}/rwf-engine
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Ma-XX-oN/RepoWorkflow.git "$RWF_ENGINE_ROOT"
          git -C "$RWF_ENGINE_ROOT" checkout --quiet --detach cd1e02acabca0b8e93844a8693110ed91d8077ea
          test "$(git -C "$RWF_ENGINE_ROOT" rev-parse HEAD)" = "cd1e02acabca0b8e93844a8693110ed91d8077ea"
          python -m pip install -r "$RWF_ENGINE_ROOT/requirements.txt"
      - name: Read durable success and failure using public RWF CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RWF_ENGINE_ROOT: ${{ runner.temp }}/rwf-engine
        run: |
          set -euo pipefail
          set +e
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 35 >out35.txt 2>err35.txt
          rc35=$?
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" remote-status 34 >out34.txt 2>err34.txt
          rc34=$?
          set -e
          printf 'CMD35 code %s\n' "$rc35"
          cat out35.txt err35.txt
          printf 'CMD34 code %s\n' "$rc34"
          cat out34.txt err34.txt
          test "$rc35" -eq 0
          test "$rc34" -eq 2
          grep -q 'RWF788_EXPECTED_FAIL' out35.txt
          grep -q 'expected-failure-declaration-missing' out34.txt
