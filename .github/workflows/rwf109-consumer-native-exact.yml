name: RWF #109 exact-source native adapter certification
on:
  push:
    branches:
      - issue-1-rwf109-consumer-integration-20261031
    paths:
      - .ci/rwf109-consumer-native-exact
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: 6e1113435002206e89af488c72243e998b17897b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert exact engine and source-limit plus focused CLI contracts
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "6e1113435002206e89af488c72243e998b17897b"
          python -m unittest -v tests.test_source_size tests.test_consumer_integration_adapter tests.test_local_integration tests.test_test_cli
