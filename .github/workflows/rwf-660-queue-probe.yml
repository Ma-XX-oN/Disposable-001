name: RWF 660 queue latency probe
on:
  push:
    branches:
      - verification-660-queue-latency-20261102
    paths:
      - .ci/queue-latency-probe
permissions:
  contents: write
jobs:
  timestamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Capture push-to-run timestamps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
          EVENT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          mkdir -p .ci/latency-results
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          commit_time=$(git show -s --format=%cI "$GH_SHA")
          python3 - "$GH_RUN_ID" "$GH_SHA" "$EVENT_TIMESTAMP" "$commit_time" "$now" <<'PY'
          import datetime
          import json
          import pathlib
          import sys
          rid, sha, event, commit, started = sys.argv[1:]
          def parse(v):
            return datetime.datetime.fromisoformat(v.replace("Z", "+00:00"))
          diff = (parse(started) - parse(event or commit)).total_seconds()
          result = {"run_id":rid, "request_sha":sha, "push_event_timestamp":event,
                    "commit_timestamp":commit, "runner_step_timestamp":started,
                    "approx_event_to_runner_seconds":diff}
          path=pathlib.Path(".ci/latency-results") / (sha + ".json")
          path.write_text(json.dumps(result, indent=2)+"\\n",encoding="utf-8")
          print(json.dumps(result))
          PY
          python3 - <<'PY'
          import datetime
          import email.utils
          import json
          import pathlib
          import time
          import urllib.request
          observations = []
          for url in ("https://www.google.com/generate_204", "https://api.github.com/rate_limit?unique=" + __import__("os").environ["GITHUB_SHA"], "https://www.cloudflare.com", "https://github.com/?unique=" + __import__("os").environ["GITHUB_SHA"]):
            try:
              t0 = time.time()
              req = urllib.request.Request(url, headers={"User-Agent": "RWF-clock-validation/1.0", "Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=8) as response:
                date = response.headers.get("Date")
                age = response.headers.get("Age")
              t1 = time.time()
              server = email.utils.parsedate_to_datetime(date).timestamp()
              # The Date header is second-granularity: actual server time in [server, server+1).
              # Also allow for the request's round-trip time.
              lower = server - t1
              upper = server + 1 - t0
              observations.append({"host":url, "server_date":date, "age":age, "rtt_seconds":round(t1-t0,3),
                                   "server_minus_runner_lower_seconds":round(lower,3),
                                   "server_minus_runner_upper_seconds":round(upper,3)})
            except Exception as exc:
              observations.append({"host":url, "error":str(exc)})
          good = [x for x in observations if "error" not in x]
          verified = bool(good) and all(x["server_minus_runner_lower_seconds"] > -1 and x["server_minus_runner_upper_seconds"] < 1 for x in good)
          result = {"observations":observations, "verified_within_one_second":verified}
          target = pathlib.Path(".ci/latency-results") / ("clock-" + __import__("os").environ["GITHUB_SHA"] + ".json")
          target.write_text(json.dumps(result,indent=2)+"\\n",encoding="utf-8")
          print("CLOCK_VALIDATION " + json.dumps(result))
          PY
          python3 - <<'PY'
          import datetime, json, os, pathlib, time, urllib.request
          req=urllib.request.Request(
            "https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+
            "/actions/runs/"+os.environ["GITHUB_RUN_ID"],
            headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                     "Accept":"application/vnd.github+json",
                     "Cache-Control":"no-cache"})
          with urllib.request.urlopen(req,timeout=15) as response:
            data=json.load(response)
          def dt(s):
            return datetime.datetime.fromisoformat(s.replace("Z","+00:00"))
          now=datetime.datetime.now(datetime.timezone.utc)
          created=dt(data["created_at"])
          updated=dt(data["updated_at"])
          result={"run_id":data["id"],"run_created_at":data["created_at"],
                  "run_updated_at":data["updated_at"],"run_status":data["status"],
                  "runner_observation_at":now.isoformat(),
                  "runner_minus_run_creation_seconds":(now-created).total_seconds()}
          target=pathlib.Path(".ci/latency-results")/("run-"+os.environ["GITHUB_SHA"]+".json")
          target.write_text(json.dumps(result,indent=2)+"\\n")
          print("RUN_TIMING "+json.dumps(result))
          PY
          git config user.name "RWF benchmark"
          git config user.email "rwf-benchmark@users.noreply.github.com"
          git add .ci/latency-results
          git commit -m "Record CI queue latency probe"
          git push origin "HEAD:${GITHUB_REF_NAME}"
