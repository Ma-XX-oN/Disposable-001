name: RWF 660 Issue Start Atomic Push Dry-Run
on:
  push:
    branches: ['issue-1-rwf660-issue-start-20261105']
    paths: ['.ci/issue660-atomic-diagnostic-trigger']
permissions:
  contents: write
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check GitHub branch creation via no-effect atomic dry-run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --heads origin refs/heads/issue-1 | grep .; then
            echo 'Target unexpectedly exists; stop'
            exit 2
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0='!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'
          set +e
          git push --dry-run --porcelain --atomic --force-with-lease=refs/heads/issue-1: origin HEAD:refs/heads/issue-1 > "$RUNNER_TEMP/push.out" 2> "$RUNNER_TEMP/push.err"
          code="$?"
          set -e
          echo "DRY_RUN_EXIT=$code"
          echo "--- provider stdout ---"
          cat "$RUNNER_TEMP/push.out"
          echo "--- provider stderr ---"
          cat "$RUNNER_TEMP/push.err"
          git clone --quiet https://github.com/Ma-XX-oN/RepoWorkflow.git "$RUNNER_TEMP/rwf660-engine"
          git -C "$RUNNER_TEMP/rwf660-engine" checkout --quiet --detach 31eb1925175d254664a382019244ebfec2e5ea0c
          test "$(git -C "$RUNNER_TEMP/rwf660-engine" rev-parse HEAD)" = 31eb1925175d254664a382019244ebfec2e5ea0c
          echo "--- execute normal issue-start into local ephemeral Git clone ---"
          export RWF_WRITER_ID=rwf660-provider
          export RWF_SESSION_ID=rwf660-diagnostic
          python -m pip install -r "$RUNNER_TEMP/rwf660-engine/requirements.txt"
          python "$RUNNER_TEMP/rwf660-engine/repo_workflow.py" --root . issue start 1
          target=refs/heads/issue-1-rwf660-push-diagnostic-20261105
          if git ls-remote --heads origin "$target" | grep .; then
            echo "Diagnostic target exists; refusing overwrite"
            exit 2
          fi
          set +e
          git push --porcelain --atomic "--force-with-lease=$target:" origin "HEAD:$target" > "$RUNNER_TEMP/actual.out" 2> "$RUNNER_TEMP/actual.err"
          actual_code="$?"
          set -e
          echo "ACTUAL_PUSH_EXIT=$actual_code"
          cat "$RUNNER_TEMP/actual.out"
          cat "$RUNNER_TEMP/actual.err"
