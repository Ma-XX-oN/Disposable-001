name: RWF 791 Public CMD Result Readback
on:
  push:
    branches:
      - 'issue-1-rwf791-final-cert-20261104'
    paths:
      - '.ci/issue791-readback-trigger'
permissions:
  contents: read
jobs:
  public-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare exact tested RWF source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Ma-XX-oN/RepoWorkflow.git "$RUNNER_TEMP/rwf-engine"
          git -C "$RUNNER_TEMP/rwf-engine" checkout --quiet --detach 1a58365cb072adc8f81d240fcf1053c1c5f49001
          test "$(git -C "$RUNNER_TEMP/rwf-engine" rev-parse HEAD)" = 1a58365cb072adc8f81d240fcf1053c1c5f49001
          python -m pip install -r "$RUNNER_TEMP/rwf-engine/requirements.txt"
      - name: Public status completed success and failure without resubmission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(git ls-remote --heads origin 'CMD-*')"
          set +e
          ok="$(python "$RUNNER_TEMP/rwf-engine/repo_workflow.py" --root "$PWD" remote-status 56 --poll 0 2>&1)"
          ok_rc=$?
          fail="$(python "$RUNNER_TEMP/rwf-engine/repo_workflow.py" --root "$PWD" remote-status 52 --poll 0 2>&1)"
          fail_rc=$?
          set -e
          printf 'CMD56 RC=%s\n%s\n' "$ok_rc" "$ok"
          printf 'CMD52 RC=%s\n%s\n' "$fail_rc" "$fail"
          test "$ok_rc" -eq 0
          test "$fail_rc" -eq 2
          grep -Fq 'CMD-56' <<<"$ok"
          grep -Fq 'COMPLETED exit=0' <<<"$ok"
          grep -Fq 'CMD-52' <<<"$fail"
          grep -Fq 'COMPLETED exit=2' <<<"$fail"
          set +e
          malformed="$(python "$RUNNER_TEMP/rwf-engine/repo_workflow.py" --root "$PWD" remote-status 53 2>&1)"
          malformed_rc=$?
          set -e
          printf 'CMD53 malformed rc=%s\n%s\n' "$malformed_rc" "$malformed"
          test "$malformed_rc" -eq 2
          grep -Fq 'CMD request argv is malformed' <<<"$malformed"
          after="$(git ls-remote --heads origin 'CMD-*')"
          test "$before" = "$after"
