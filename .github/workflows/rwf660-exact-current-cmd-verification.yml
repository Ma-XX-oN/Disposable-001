name: RWF 660 publication race corrected live CMD acceptance
on:
  push:
    branches: ['issue-9909-rwf660-publish-race-20261107']
    paths: ['.github/workflows/rwf660-exact-current-cmd-verification.yml']
permissions:
  contents: write
jobs:
  live-cmd:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RWF_CMD_PUSH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run public RWF remote commands through actual CMD forwarding and readback
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RWF_CMD_PUSH_TOKEN }}
          RWF_WRITER_ID: rwf660-provider
          RWF_SESSION_ID: rwf660-live-exact
        run: |
          set -euo pipefail
          # No fallback to GITHUB_TOKEN: its pushes cannot trigger CMD workflow.
          test -n "${GITHUB_TOKEN:-}" || { echo 'RWF_CMD_PUSH_TOKEN repository secret is required' >&2; exit 2; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git clone --quiet https://github.com/Ma-XX-oN/RepoWorkflow.git "$RUNNER_TEMP/rwf-engine"
          git -C "$RUNNER_TEMP/rwf-engine" checkout --quiet --detach 2128db875d499d056351d167b7a020136f6674d3
          test "$(git -C "$RUNNER_TEMP/rwf-engine" rev-parse HEAD)" = '2128db875d499d056351d167b7a020136f6674d3'
          python -m pip install -r "$RUNNER_TEMP/rwf-engine/requirements.txt"
          echo 'BEGIN_VERIFIED_COMMAND_SUCCESS'
          python "$RUNNER_TEMP/rwf-engine/repo_workflow.py" --root . version --json --remote --poll 4
          echo 'END_VERIFIED_COMMAND_SUCCESS'
          echo 'BEGIN_VERIFIED_COMMAND_NONZERO'
          set +e
          python "$RUNNER_TEMP/rwf-engine/repo_workflow.py" --root . init local-only --remote --poll 4
          result=$?
          set -e
          echo "NONZERO_COMMAND_EXIT=$result"
          test "$result" -eq 2
          echo 'END_VERIFIED_COMMAND_NONZERO'
