name: RWF 791 Valid RED Remote Selection Atomicity
on:
  push:
    branches: [issue-1-rwf791-readback-*]
    paths: [.ci/valid-selection-trigger]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b3f80a680fdd725e14b349a60c335a9bb9611f84
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify declared group remote submission does not change source selection
        shell: bash
        env:
          RWF_ENGINE_ROOT: ${{ runner.temp }}/rwf-engine
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b3f80a680fdd725e14b349a60c335a9bb9611f84"
          git switch -c issue-1-rwf791-selection-boundary-20261104
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git clone --quiet https://github.com/Ma-XX-oN/RepoWorkflow.git "$RWF_ENGINE_ROOT"
          git -C "$RWF_ENGINE_ROOT" checkout --quiet --detach 086cb4a0cc4740246fc0019f51187c92522c8fd9
          test "$(git -C "$RWF_ENGINE_ROOT" rev-parse HEAD)" = "086cb4a0cc4740246fc0019f51187c92522c8fd9"
          test "$(cat .ci/red-green.txt)" = "issue-1-lifecycle"
          before="$(git rev-parse HEAD)"
          python "$RWF_ENGINE_ROOT/repo_workflow.py" --root "$PWD" test RED issue-1-rwf788-red --remote | tee "$RUNNER_TEMP/submitted.txt"
          after="$(git rev-parse HEAD)"
          test "$before" = "$after"
          test "$(cat .ci/red-green.txt)" = "issue-1-lifecycle"
          grep -Eq '^CMD-[0-9]+ CMD-[0-9]+-issue-1-rwf791-selection-boundary-20261104 SUBMITTED$' "$RUNNER_TEMP/submitted.txt"
          branch="$(awk '/ SUBMITTED$/ { print $2 }' "$RUNNER_TEMP/submitted.txt")"
          git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          tip="$(git rev-parse "refs/remotes/origin/$branch")"
          test "$(git rev-parse "$tip^")" = "$before"
          test "$(git diff-tree --no-commit-id --name-only -r "$tip")" = ".ci/rwf"
          test "$(git show "$tip:.ci/rwf")" = "test RED issue-1-rwf788-red --remote 0"
          echo "PASS: valid remote CMD submitted from unchanged source and unchanged RED selection"
