name: RWF 109 disposable GREEN and gate probe
on:
  push:
    branches:
      - issue-1-rwf109-done-acceptance-20261101
    paths:
      - .ci/rwf109-green
permissions:
  contents: read
  issues: read
jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: disposable
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: d3c8fef54d6eff45d3c2b6fa04ef6baf1688a75d
          path: engine
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r engine/requirements.txt
      - name: Assert exact source
        shell: bash
        run: |
          test "$(git -C engine rev-parse HEAD)" = "d3c8fef54d6eff45d3c2b6fa04ef6baf1688a75d"
          test "$(git -C disposable branch --show-current)" = "issue-1-rwf109-done-acceptance-20261101"
      - name: Verify GREEN regression integration and unhappy paths through RWF
        shell: bash
        run: |
          set -euo pipefail
          cd disposable
          git config user.name 'RWF disposable test worker'
          git config user.email 'rwf-disposable@example.invalid'
          git -c protocol.file.allow=always submodule add "$PWD/../engine" RepoWorkflow
          git -C RepoWorkflow checkout d3c8fef54d6eff45d3c2b6fa04ef6baf1688a75d
          git config -f .gitmodules submodule.RepoWorkflow.url https://github.com/Ma-XX-oN/RepoWorkflow.git
          mkdir -p .ci .github/workflows scripts
          cp RepoWorkflow/templates/github/ci.yml .github/workflows/ci.yml
          rm -f .github/workflows/rwf109-disposable-acceptance.yml .github/workflows/rwf109-disposable-green.yml
          printf '1.0.0-issue.1.1\n' > .ci/run-ci-request
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('.ci')
          (base / 'branch-policy.json').write_text(json.dumps({
            'schema': 2, 'integrationBranch': 'main', 'branches': {}, 'patterns': []
          }))
          (base / 'github.json').write_text(json.dumps({
            'schema': 1, 'prepareRunner': 'ubuntu-latest',
            'runners': {'local': 'ubuntu-latest'}
          }))
          (base / 'repoworkflow.json').write_text(json.dumps({
            'schema': 1,
            'versionCommand': ['python', 'scripts/version.py'],
            'repository': {'integrationBranch': 'main', 'authoritativeRemote': 'origin'},
            'environments': [{
              'id': 'local', 'required': True, 'platform': 'any',
              'validationCommand': ['python', 'scripts/validate.py']
            }],
            'artifacts': []
          }))
          PY
          printf 'import sys\nprint("1.0.0")\n' > scripts/version.py
          printf 'import unittest\nassert unittest.defaultTestLoader.discover("tests")\n' > scripts/validate.py
          git add -A
          git commit -m 'Disposable hosted fixture: pinned RWF consumer adoption'
          python -m unittest -v tests.test_issue_1_smoke tests.test_issue_1_integration
          # RED selection/evidence from earlier workbench jobs is not transferred.
          # GREEN therefore must not be advertised as complete by this job.
          set +e
          python RepoWorkflow/repo_workflow.py --root . test regression > ../regression.out 2> ../regression.err
          regression_rc=$?
          python RepoWorkflow/repo_workflow.py --root . test integration > ../integration.out 2> ../integration.err
          integration_rc=$?
          set -e
          printf 'REGRESSION_EXIT=%s INTEGRATION_EXIT=%s\n' "$regression_rc" "$integration_rc"
          cat ../regression.err ../integration.err
          test "$regression_rc" -eq 2
          test "$integration_rc" -eq 2
          grep -q 'no branch policy rule matches issue-1-rwf109-done-acceptance-20261101' ../regression.err
          grep -q 'consumer integration requires an authoritative environment adapter' ../integration.err
          # These negative assertions prove fail-closed admission; neither stage PASSes.
      - name: Verify missing external done authority fails closed
        shell: bash
        run: |
          set -euo pipefail
          cd disposable
          set +e
          python RepoWorkflow/repo_workflow.py --root . done patch > ../done-green.out 2> ../done-green.err
          rc=$?
          set -e
          printf 'DONE_EXIT=%s\n' "$rc"
          cat ../done-green.out
          cat ../done-green.err
          test "$rc" -ne 0
          grep -q 'independent done execution authority is unavailable' ../done-green.err
      - name: Replay genuine RED to GREEN via RWF in one isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          cd disposable
          green_base="$(git rev-parse HEAD)"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('issue_1_feature.py')
          code = path.read_text()
          assert code.count('return left + right') == 1
          path.write_text(code.replace('return left + right', 'return left'))
          path = Path('.ci/tests.json')
          catalog = json.loads(path.read_text())
          group = catalog['tests'][0]['issue-1-lifecycle']
          group['expected-red'] = {
            'exit-code': 1, 'output-contains': '1 != 2'
          }
          path.write_text(json.dumps(catalog, indent=2) + '\n')
          PY
          git add issue_1_feature.py .ci/tests.json
          git commit -m 'Fixture: preimplementation RED candidate'
          python RepoWorkflow/repo_workflow.py --root . test RED issue-1-lifecycle > ../rwf-red.out 2> ../rwf-red.err
          git show "$green_base:issue_1_feature.py" > issue_1_feature.py
          git show "$green_base:.ci/tests.json" > .ci/tests.json
          git add issue_1_feature.py .ci/tests.json
          git commit -m 'Fixture: implement accepted GREEN solution'
          python RepoWorkflow/repo_workflow.py --root . test GREEN > ../rwf-green.out 2> ../rwf-green.err
          python - <<'PY'
          from pathlib import Path
          import json
          rows = [json.loads(line) for line in Path('.repoworkflow/validation/testResults-1.jsonl').read_text().splitlines()]
          assert any(row.get('kind') == 'RED' and row.get('redStatus') == 'RED' for row in rows), rows
          assert any(row.get('kind') == 'GREEN' and row.get('result') == 'succeeded' for row in rows), rows
          assert not Path('.ci/temp-tests.json').exists()
          PY
      - name: Exercise public issue start with live GitHub issue metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd disposable
          python - <<'PY'
          from pathlib import Path
          import json
          config_path = Path('.ci/repoworkflow.json')
          config = json.loads(config_path.read_text())
          config['versionCommand'] = ['python', 'scripts/version.py']
          config['infoCommand'] = ['python', 'RepoWorkflow/adapters/repo-info-github.py', '--repository', 'Ma-XX-oN/Disposable-001']
          config_path.write_text(json.dumps(config, indent=2) + '\n')
          Path('VERSION').write_text('1.2.3\n')
          PY
          cat > scripts/version.py <<'PY'
          from pathlib import Path
          import sys
          path = Path('VERSION')
          value = path.read_text().strip()
          args = sys.argv[1:]
          if args:
            assert args[:2] == ['task', '--issue'] and len(args) == 3, args
            major, minor, patch = value.split('.')
            value = f'{major}.{minor}.{patch}-issue.{args[2]}.0.1'
            path.write_text(value + '\n')
          print(value)
          PY
          PYTHONPATH=RepoWorkflow python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          from repo_workflow.relationship_store import RelationshipStore
          from repo_workflow.relationships import IssueRelationships, RelationshipGraph
          from repo_workflow.state_store import WriterIdentity
          result = subprocess.run(
            ['gh', 'issue', 'view', '1', '--repo', 'Ma-XX-oN/Disposable-001', '--json', 'title,state'],
            check=True, capture_output=True, text=True
          )
          info = json.loads(result.stdout)
          assert info['state'] == 'OPEN', info
          RelationshipStore(Path.cwd()).create(
            RelationshipGraph(issues={'1': IssueRelationships(info['title'], ())}),
            WriterIdentity('disposable-seed', 'disposable-seed-session')
          )
          PY
          git add -A
          git commit -m 'Fixture: seed canonical relationship and version adapter'
          python RepoWorkflow/repo_workflow.py --root . issue info 1 > ../rwf-issue-info.txt
          python RepoWorkflow/repo_workflow.py --root . issue start 1 > ../rwf-start.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          started = json.loads(Path('../rwf-start.json').read_text())
          assert started['issue'] == '1', started
          assert started['branch'] == 'issue-1', started
          assert started['version'].startswith('1.2.3-issue.1.'), started
          active = subprocess.check_output(['git', 'branch', '--show-current'], text=True).strip()
          assert active == 'issue-1', active
          PY
      - name: Run RWF regression and integration on RWF-started issue branch
        shell: bash
        run: |
          set -euo pipefail
          cd disposable
          python - <<'PY'
          import json
          from pathlib import Path
          policy = Path('.ci/branch-policy.json')
          value = json.loads(policy.read_text())
          value['branches']['issue-1'] = {'allowedDependencies': []}
          policy.write_text(json.dumps(value, indent=2) + '\n')
          Path('scripts/validate.py').write_text(
            'import sys, unittest\n'
            'sys.dont_write_bytecode = True\n'
            'sys.path.insert(0, ".")\n'
            'suite = unittest.defaultTestLoader.discover("tests")\n'
            'result = unittest.TextTestRunner(verbosity=2).run(suite)\n'
            'raise SystemExit(0 if result.wasSuccessful() else 1)\n'
          )
          PY
          git add .ci/branch-policy.json scripts/validate.py VERSION
          git commit -m 'Fixture: authorize issue-1 branch and execute real validation'
          git status --short
          git add -A
          git diff --cached --quiet || git commit -m 'Fixture: commit remaining RWF lifecycle materialization'
          find tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git status --short
          set +e
          python RepoWorkflow/repo_workflow.py --root . test regression > ../rwf-regression.out 2> ../rwf-regression.err
          regression_rc=$?
          python RepoWorkflow/repo_workflow.py --root . test integration > ../rwf-integration.out 2> ../rwf-integration.err
          integration_rc=$?
          set -e
          printf 'RWF_REGRESSION_EXIT=%s RWF_INTEGRATION_EXIT=%s\n' "$regression_rc" "$integration_rc"
          cat ../rwf-regression.out ../rwf-regression.err ../rwf-integration.out ../rwf-integration.err
          test "$regression_rc" -eq 0
          test "$integration_rc" -eq 2
          grep -q 'consumer integration requires an authoritative environment adapter' ../rwf-integration.err
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rwf109-disposable-green
          path: |
            regression.out
            regression.err
            integration.out
            integration.err
            done-green.out
            done-green.err
            rwf-red.out
            rwf-red.err
            rwf-green.out
            rwf-green.err
            rwf-issue-info.txt
            rwf-start.json
            rwf-regression.out
            rwf-regression.err
            rwf-integration.out
            rwf-integration.err
          if-no-files-found: warn
