name: RepoWorkflow CMD Forwarding

# Separate from .ci/run; this adapter is not an alternate RWF dispatcher.
on:
  push:
    branches:
      - 'CMD-**'
    paths:
      - '.ci/rwf'

permissions:
  contents: write

concurrency:
  group: rwf-cmd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forward:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/CMD-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CMD request and full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore authoritative origin refs
        shell: bash
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Checkout pinned RWF engine outside consumer workspace
        shell: bash
        env:
          RWF_ENGINE_ROOT: ${{ runner.temp }}/rwf-engine
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Ma-XX-oN/RepoWorkflow.git "$RWF_ENGINE_ROOT"
          git -C "$RWF_ENGINE_ROOT" checkout --quiet --detach 31eb1925175d254664a382019244ebfec2e5ea0c
          test "$(git -C "$RWF_ENGINE_ROOT" rev-parse HEAD)" = 31eb1925175d254664a382019244ebfec2e5ea0c
          python -m pip install -r "$RWF_ENGINE_ROOT/requirements.txt"
      - name: Forward authenticated CMD argv through normal CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RWF_ENGINE_ROOT: ${{ runner.temp }}/rwf-engine
          RWF_WRITER_ID: rwf660-provider
          RWF_SESSION_ID: rwf660-issue-start
        run: |
          set -euo pipefail
          # Propagate provider authentication into the wrapper's isolated
          # source clone without changing tracked files or storing a token.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0='!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f'
          python "$RWF_ENGINE_ROOT/scripts/hosted-rwf-forward.py"
