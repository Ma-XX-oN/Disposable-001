name: RWF 109 disposable lifecycle acceptance probe
on:
  push:
    branches:
      - issue-1-rwf109-done-acceptance-20261101
    paths:
      - .ci/rwf109-run
permissions:
  contents: read
jobs:
  disposable-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: disposable
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: d3c8fef54d6eff45d3c2b6fa04ef6baf1688a75d
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install RWF dependencies
        run: python -m pip install -r engine/requirements.txt
      - name: Assert exact engine and isolated issue branch
        shell: bash
        run: |
          test "$(git -C engine rev-parse HEAD)" = "d3c8fef54d6eff45d3c2b6fa04ef6baf1688a75d"
          test "$(git -C disposable branch --show-current)" = "issue-1-rwf109-done-acceptance-20261101"
      - name: Verify real RED and temporary test stages on issue branch
        shell: bash
        run: |
          set -euo pipefail
          cd disposable
          git config user.name 'RWF disposable test worker'
          git config user.email 'rwf-disposable@example.invalid'
          python ../engine/repo_workflow.py --root . test RED issue-1-lifecycle
          python ../engine/repo_workflow.py --root . test temporary
          python ../engine/repo_workflow.py --root . test results > ../red-result.json
          python - <<'PY'
          from pathlib import Path
          import json
          records = [json.loads(line) for line in Path('.repoworkflow/validation/testResults-1.jsonl').read_text().splitlines()]
          assert any(r.get('kind') == 'RED' and r.get('redStatus') == 'RED' for r in records)
          assert any(r.get('kind') == 'temporary' and r.get('result') == 'succeeded' for r in records)
          PY
      - name: Probe public command and fail-closed default done
        shell: bash
        run: |
          set -euo pipefail
          cd disposable
          python ../engine/repo_workflow.py --root . done --help
          set +e
          python ../engine/repo_workflow.py --root . done patch > ../done.out 2> ../done.err
          rc=$?
          set -e
          echo "DEFAULT_DONE_EXIT=$rc"
          cat ../done.out
          cat ../done.err
          test "$rc" -ne 0
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rwf109-disposable-probe
          path: |
            done.out
            done.err
            red-result.json
          if-no-files-found: warn
