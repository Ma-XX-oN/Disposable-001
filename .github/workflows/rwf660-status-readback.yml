name: RWF 660 CMD Readback Verification
on:
  push:
    branches: ['issue-1-rwf660-provider-20261105']
    paths: ['.ci/rwf660-status-trigger']
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact engine and both completed outcomes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Ma-XX-oN/RepoWorkflow.git "$RUNNER_TEMP/rwf660-engine"
          git -C "$RUNNER_TEMP/rwf660-engine" checkout --quiet --detach ed873a47f6e53f8a9726023091a6ebed7dd49064
          test "$(git -C "$RUNNER_TEMP/rwf660-engine" rev-parse HEAD)" = ed873a47f6e53f8a9726023091a6ebed7dd49064
          python -m pip install -r "$RUNNER_TEMP/rwf660-engine/requirements.txt"
          set +e
          python "$RUNNER_TEMP/rwf660-engine/repo_workflow.py" --root . remote-status 68 > "$RUNNER_TEMP/cmd68.out" 2>&1
          result68="$?"
          python "$RUNNER_TEMP/rwf660-engine/repo_workflow.py" --root . remote-status 67 > "$RUNNER_TEMP/cmd67.out" 2>&1
          result67="$?"
          set -e
          cat "$RUNNER_TEMP/cmd68.out"
          cat "$RUNNER_TEMP/cmd67.out"
          test "$result68" -eq 2
          test "$result67" -eq 0
          grep -Fq 'CMD-68 CMD-68-issue-1-rwf660-provider-20261105 COMPLETED exit=2' "$RUNNER_TEMP/cmd68.out"
          grep -Fq 'CMD-67 CMD-67-issue-1-rwf660-provider-20261105 COMPLETED exit=0' "$RUNNER_TEMP/cmd67.out"
          grep -Fq 'rwf init execution is not implemented yet' "$RUNNER_TEMP/cmd68.out"
          grep -Fq 'RWF788_EXPECTED_FAIL' "$RUNNER_TEMP/cmd67.out"
