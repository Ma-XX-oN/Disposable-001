name: RWF583 native macOS certification
on:
  push:
    branches: [verification-583-exact-source-20261116]
    paths: [.github/workflows/verification-583-macos.yml]
permissions:
  contents: read
jobs:
  certify:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: 62223b89eb4f1b78fb52f107190c76703c4282b0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert exact tested source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "62223b89eb4f1b78fb52f107190c76703c4282b0"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Functional lifecycle CSV graph and completion regression
        run: >-
          python scripts/validate-issue.py --groups
          issue-583-lifecycle-certification issue-583-lifecycle-cross-product
          issue-583-candidate-revalidation issue-583-clone-publication
          issue-583-clone-recovery issue-583-csv-merge issue-583-csv-freshness
          issue-583-layout-stability issue-583-terminal-accessibility
          issue-583-transaction-recovery issue-583-legacy-migration
          issue-581-csv-state-projection issue-582-graph-current
          issue-582-geometry-regression integration-renderer-certification-binding
          issue-583-authoritative-validate
          issue-109-functional-workflow issue-109-submission issue-109-single-prelim
          issue-109-source-identity regression-version-adapter
          regression-manual-test-catalogue regression-manual-test-result
          integration-manual-test-cli issue-583-graph-platform-probe
          issue-583-ticket-merge-probe issue-583-argv-limits-probe
