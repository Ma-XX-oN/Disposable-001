name: RWF 109 current-source read-only provider matrix
on:
  push:
    branches: [issue-1-rwf109-consumer-integration-20261031]
    paths: [.ci/rwf109-live-read]
permissions:
  contents: read
jobs:
  provider-read:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ma-XX-oN/RepoWorkflow
          ref: fd5c5653c14d438f0b0243afd5907ab0cc5424bb
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact-source RWF host read-only provider and GitHub parity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "fd5c5653c14d438f0b0243afd5907ab0cc5424bb"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from repo_workflow.done_host_transport import bind_native_integration_host
          from repo_workflow.done_host_coordinator import IntegrationHostCoordinator
          repository = "Ma-XX-oN/RepoWorkflow"
          def api(path):
            req = Request("https://api.github.com/repos/" + repository + "/" + path,
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"})
            with urlopen(req, timeout=30) as result:
              return json.load(result)
          before = api("git/ref/heads/main")["object"]["sha"]
          host = bind_native_integration_host(repository=repository, engine_root=Path.cwd())
          coordinator = IntegrationHostCoordinator(host)
          ready = coordinator.read_ready_prelims()
          inventory = api("git/matching-refs/heads/PRELIM-")
          refs = {item["ref"] for item in inventory}
          assert {item.ref for item in ready} == refs
          lease = coordinator.read_destination_lease("main")
          destination = host.request("destination.read", "issue109-exact-live-read",
                                     {"destination": "main"})
          after = api("git/ref/heads/main")["object"]["sha"]
          assert before == after == destination["sha"]
          assert lease.destination == "main" and lease.generation >= 0
          print("READ_ONLY_PROVIDER_PASS", "ready_count="+str(len(refs)),
                "main_sha="+after, "generation="+str(lease.generation), flush=True)
          PY
