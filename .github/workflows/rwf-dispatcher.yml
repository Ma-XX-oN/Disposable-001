name: rwf-dispatcher

# Test: can the workflow's own GITHUB_TOKEN dispatch rwf-delayed with inputs,
# and cancel one of those runs while it waits on the environment timer?
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch two delayed runs
        run: |
          date -u
          gh workflow run rwf-delayed.yml -f parent=issue.5.0 -f prelim=PRELIM-keep
          gh workflow run rwf-delayed.yml -f parent=issue.5.0 -f prelim=PRELIM-cancel
      - name: Cancel the second while it waits
        run: |
          sleep 20
          gh run list --workflow rwf-delayed.yml --limit 5 --json databaseId,status,displayTitle,createdAt
          id=$(gh run list --workflow rwf-delayed.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Cancelling run $id"
          gh run cancel "$id"
          sleep 5
          gh run view "$id" --json status,conclusion
